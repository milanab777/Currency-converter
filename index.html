<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AUD → IDR Converter</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #ffffff;
    padding: 20px;
  }
  .card {
    max-width: 380px;
    margin: 0 auto;
    border: 1px solid #e6e6e4;
    border-radius: 12px;
    padding: 20px;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    color: #37352f;
    margin: 0 0 16px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  input[type="number"] {
    flex: 1;
    padding: 10px 12px;
    font-size: 16px;
    border: 1px solid #e6e6e4;
    border-radius: 8px;
    outline: none;
    width: 100%;
  }
  input[type="number"]:focus {
    border-color: #2383e2;
  }
  .flag {
    font-size: 20px;
  }
  .label {
    width: 52px;
    font-weight: 600;
    color: #37352f;
    font-size: 14px;
  }
  .swap-row {
    text-align: center;
    margin: 4px 0;
  }
  .swap-btn {
    background: #f7f6f3;
    border: 1px solid #e6e6e4;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 13px;
    color: #37352f;
  }
  .swap-btn:hover {
    background: #eeece9;
  }
  .meta {
    margin-top: 12px;
    font-size: 12px;
    color: #9b9a97;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .refresh-btn {
    background: none;
    border: none;
    color: #2383e2;
    cursor: pointer;
    font-size: 12px;
    padding: 0;
  }
  .rate-line {
    font-size: 12px;
    color: #6b6a67;
    margin-top: 6px;
  }
  .error {
    color: #eb5757;
    font-size: 12px;
    margin-top: 8px;
  }
</style>
</head>
<body>

<div class="card">
  <h1><span class="flag">🇦🇺</span> ↔ <span class="flag">🇮🇩</span> AUD / IDR Converter</h1>

  <div class="row">
    <div class="label">AUD</div>
    <input type="number" id="aud" value="1" min="0" step="any" />
  </div>

  <div class="swap-row">
    <button class="swap-btn" id="swapBtn">↕ swap direction of entry</button>
  </div>

  <div class="row">
    <div class="label">IDR</div>
    <input type="number" id="idr" value="0" min="0" step="any" />
  </div>

  <div class="rate-line" id="rateLine">Loading live rate…</div>
  <div class="error" id="errorLine" style="display:none;"></div>

  <div class="meta">
    <span id="updated">—</span>
    <button class="refresh-btn" id="refreshBtn">Refresh now</button>
  </div>
</div>

<script>
  let rate = null; // 1 AUD in IDR
  let baseIsAUD = true; // which field drives the calculation

  const audInput = document.getElementById('aud');
  const idrInput = document.getElementById('idr');
  const rateLine = document.getElementById('rateLine');
  const errorLine = document.getElementById('errorLine');
  const updated = document.getElementById('updated');
  const refreshBtn = document.getElementById('refreshBtn');
  const swapBtn = document.getElementById('swapBtn');

  async function fetchRate() {
    errorLine.style.display = 'none';
    rateLine.textContent = 'Refreshing rate…';
    try {
      const res = await fetch('https://api.frankfurter.app/latest?from=AUD&to=IDR');
      if (!res.ok) throw new Error('bad response');
      const data = await res.json();
      rate = data.rates.IDR;
      rateLine.textContent = `1 AUD = ${rate.toLocaleString(undefined, {maximumFractionDigits: 2})} IDR`;
      const now = new Date();
      updated.textContent = 'Updated ' + now.toLocaleTimeString();
      recalc();
    } catch (e) {
      errorLine.style.display = 'block';
      errorLine.textContent = 'Could not fetch live rate. Check connection and try refresh.';
      rateLine.textContent = rate ? `Last known: 1 AUD = ${rate.toLocaleString(undefined,{maximumFractionDigits:2})} IDR` : 'Rate unavailable';
    }
  }

  function recalc() {
    if (!rate) return;
    if (baseIsAUD) {
      const audVal = parseFloat(audInput.value) || 0;
      idrInput.value = (audVal * rate).toFixed(2);
    } else {
      const idrVal = parseFloat(idrInput.value) || 0;
      audInput.value = (idrVal / rate).toFixed(2);
    }
  }

  audInput.addEventListener('input', () => { baseIsAUD = true; recalc(); });
  idrInput.addEventListener('input', () => { baseIsAUD = false; recalc(); });
  refreshBtn.addEventListener('click', fetchRate);
  swapBtn.addEventListener('click', () => {
    baseIsAUD = !baseIsAUD;
    recalc();
  });

  fetchRate();
  // auto-refresh every 5 minutes
  setInterval(fetchRate, 5 * 60 * 1000);
</script>

</body>
</html>
