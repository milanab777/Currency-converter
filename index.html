<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AUD → IDR Converter</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #ffffff;
    padding: 20px;
  }
  .card {
    max-width: 380px;
    margin: 0 auto;
    border: 1px solid #e6e6e4;
    border-radius: 12px;
    padding: 20px;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    color: #37352f;
    margin: 0 0 16px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  input[type="number"] {
    flex: 1;
    padding: 10px 12px;
    font-size: 16px;
    border: 1px solid #e6e6e4;
    border-radius: 8px;
    outline: none;
    width: 100%;
  }
  input[type="number"]:focus {
    border-color: #2383e2;
  }
  .flag {
    font-size: 20px;
  }
  .label {
    width: 52px;
    font-weight: 600;
    color: #37352f;
    font-size: 14px;
  }
  .swap-row {
    text-align: center;
    margin: 4px 0;
  }
  .swap-btn {
    background: #f7f6f3;
    border: 1px solid #e6e6e4;
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 13px;
    color: #37352f;
  }
  .swap-btn:hover {
    background: #eeece9;
  }
  .meta {
    margin-top: 12px;
    font-size: 12px;
    color: #9b9a97;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .refresh-btn {
    background: none;
    border: none;
    color: #2383e2;
    cursor: pointer;
    font-size: 12px;
    padding: 0;
  }
  .rate-line {
    font-size: 12px;
    color: #6b6a67;
    margin-top: 6px;
  }
  .error {
    color: #eb5757;
    font-size: 12px;
    margin-top: 8px;
    line-height: 1.4;
  }
  .manual-block {
    display: none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed #e6e6e4;
  }
  .manual-block.show {
    display: block;
  }
  .manual-label {
    font-size: 12px;
    color: #6b6a67;
    margin-bottom: 6px;
  }
  .manual-row {
    display: flex;
    gap: 8px;
  }
  .manual-row input {
    flex: 1;
    padding: 8px 10px;
    font-size: 14px;
    border: 1px solid #e6e6e4;
    border-radius: 8px;
  }
  .manual-row button {
    background: #2383e2;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .manual-row button:hover {
    background: #1a6dc4;
  }
</style>

</head>
<body>

<div class="card">
  <h1><span class="flag">🇦🇺</span> ↔ <span class="flag">🇮🇩</span> AUD / IDR Converter</h1>

  <div class="row">
    <div class="label">AUD</div>
    <input type="number" id="aud" value="1" min="0" step="any" />
  </div>

  <div class="swap-row">
    <button class="swap-btn" id="swapBtn">↕ swap direction of entry</button>
  </div>

  <div class="row">
    <div class="label">IDR</div>
    <input type="number" id="idr" value="0" min="0" step="any" />
  </div>

  <div class="rate-line" id="rateLine">Loading live rate…</div>
  <div class="error" id="errorLine" style="display:none;"></div>

  <div class="manual-block" id="manualBlock">
    <div class="manual-label">Enter today's rate manually (1 AUD = ? IDR) so the converter still works:</div>
    <div class="manual-row">
      <input type="number" id="manualRate" placeholder="e.g. 10500" min="0" step="any" />
      <button id="manualBtn">Use rate</button>
    </div>
  </div>

  <div class="meta">
    <span id="updated">—</span>
    <button class="refresh-btn" id="refreshBtn">Refresh now</button>
  </div>
</div>

<script>
  let rate = null; // 1 AUD in IDR
  let baseIsAUD = true; // which field drives the calculation

  const audInput = document.getElementById('aud');
  const idrInput = document.getElementById('idr');
  const rateLine = document.getElementById('rateLine');
  const errorLine = document.getElementById('errorLine');
  const updated = document.getElementById('updated');
  const refreshBtn = document.getElementById('refreshBtn');
  const swapBtn = document.getElementById('swapBtn');
  const manualBlock = document.getElementById('manualBlock');
  const manualRateInput = document.getElementById('manualRate');
  const manualBtn = document.getElementById('manualBtn');
  let isManualRate = false;

  // Try a list of free, no-key providers in order until one works.
  const providers = [
    {
      name: 'frankfurter.dev',
      url: 'https://api.frankfurter.dev/v1/latest?base=AUD&symbols=IDR',
      parse: (data) => data.rates.IDR
    },
    {
      name: 'frankfurter.app',
      url: 'https://api.frankfurter.app/latest?from=AUD&to=IDR',
      parse: (data) => data.rates.IDR
    },
    {
      name: 'open.er-api.com',
      url: 'https://open.er-api.com/v6/latest/AUD',
      parse: (data) => data.rates.IDR
    },
    {
      name: 'exchangerate.host',
      url: 'https://api.exchangerate.host/latest?base=AUD&symbols=IDR',
      parse: (data) => data.rates.IDR
    }
  ];

  async function fetchRate() {
    errorLine.style.display = 'none';
    rateLine.textContent = 'Refreshing rate…';
    let lastError = null;

    for (const provider of providers) {
      try {
        const res = await fetch(provider.url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const value = provider.parse(data);
        if (!value || isNaN(value)) throw new Error('no IDR value in response');

        rate = value;
        isManualRate = false;
        manualBlock.classList.remove('show');
        rateLine.textContent = `1 AUD = ${rate.toLocaleString(undefined, {maximumFractionDigits: 2})} IDR (via ${provider.name})`;
        const now = new Date();
        updated.textContent = 'Updated ' + now.toLocaleTimeString();
        recalc();
        return; // success, stop trying providers
      } catch (e) {
        lastError = e;
        continue; // try next provider
      }
    }

    // all providers failed — offer manual entry so the converter still works
    errorLine.style.display = 'block';
    errorLine.textContent = 'Could not reach a live rate provider' + (lastError ? ` (${lastError.message})` : '') + '. This usually happens when the page is opened as a local file rather than a hosted URL — it will resolve once this is hosted (e.g. GitHub Pages) or embedded in Notion. In the meantime, enter today\'s rate below and the converter will keep working.';
    manualBlock.classList.add('show');
    if (!rate) {
      rateLine.textContent = 'Rate unavailable — enter one manually below';
    } else if (isManualRate) {
      rateLine.textContent = `1 AUD = ${rate.toLocaleString(undefined,{maximumFractionDigits:2})} IDR (manual)`;
    } else {
      rateLine.textContent = `Last known live rate: 1 AUD = ${rate.toLocaleString(undefined,{maximumFractionDigits:2})} IDR`;
    }
  }

  manualBtn.addEventListener('click', () => {
    const val = parseFloat(manualRateInput.value);
    if (!val || val <= 0) {
      manualRateInput.focus();
      return;
    }
    rate = val;
    isManualRate = true;
    rateLine.textContent = `1 AUD = ${rate.toLocaleString(undefined,{maximumFractionDigits:2})} IDR (manual)`;
    updated.textContent = 'Set manually';
    errorLine.style.display = 'none';
    recalc();
  });

  function recalc() {
    if (!rate) return;
    if (baseIsAUD) {
      const audVal = parseFloat(audInput.value) || 0;
      idrInput.value = (audVal * rate).toFixed(2);
    } else {
      const idrVal = parseFloat(idrInput.value) || 0;
      audInput.value = (idrVal / rate).toFixed(2);
    }
  }

  audInput.addEventListener('input', () => { baseIsAUD = true; recalc(); });
  idrInput.addEventListener('input', () => { baseIsAUD = false; recalc(); });
  refreshBtn.addEventListener('click', fetchRate);
  swapBtn.addEventListener('click', () => {
    baseIsAUD = !baseIsAUD;
    recalc();
  });

  fetchRate();
  // auto-refresh every 5 minutes
  setInterval(fetchRate, 5 * 60 * 1000);
</script>

</body>
</html>
